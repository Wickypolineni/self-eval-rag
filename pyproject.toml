[project]
name = "rag-lesson-evaluator"
version = "0.1.0"
description = "A self-evaluating lesson generator: generate -> evaluate -> regenerate, with binary quality gates and cross-run memory."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2",
    "langchain-openrouter>=0.2.8",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
lesson-agent = "lesson_agent.main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lesson_agent"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
